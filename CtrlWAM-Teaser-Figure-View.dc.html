<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="site/vendor/katex/katex.min.css">
<script defer src="site/vendor/katex/katex.min.js"></script>
<style>@font-face{font-family:"Latin Modern Math";src:url("https://cdn.jsdelivr.net/npm/mathjax-full@3.2.2/es5/output/chtml/fonts/woff-v2/MathJax_Math-Italic.woff") format("woff");font-style:italic;font-display:swap;}@font-face{font-family:"Latin Modern Math";src:url("https://cdn.jsdelivr.net/npm/mathjax-full@3.2.2/es5/output/chtml/fonts/woff-v2/MathJax_Main-Regular.woff") format("woff");font-style:normal;font-display:swap;}</style>
<style>math{font-family:"Latin Modern Math","Computer Modern","CMU Serif","Cambria Math",serif;} body{margin:0;background:transparent;} a{color:#0B1A3A;} a:hover{color:#88CC02;} .katex{line-height:1 !important;} .katex .strut{display:none !important;} [contenteditable="true"]{outline:1.5px solid #4A72B5;outline-offset:2px;border-radius:2px;}</style>
</helmet>

<div ref="{{ wrapRef }}" style="margin:0;overflow:hidden;width:100%;display:block">
<div style="transform-origin:0 0" ref="{{ scaleRef }}">
<div ref="{{ canvasRef }}" data-screen-label="CtrlWAM Teaser Figure v5 (bottom)" style="position:relative;width:1450px;height:496px;box-sizing:border-box;background:#FFFFFF;border:1px solid #DCE2EC;border-radius:16px;overflow:hidden;font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#2E2E2E;user-select:text">

  <sc-for list="{{ panels }}" as="pn" hint-placeholder-count="4">
    <div data-x="{{ pn.x }}" data-y="{{ pn.y }}" data-w="{{ pn.w }}" data-h="{{ pn.h }}" data-fill="{{ pn.fill }}" data-stroke="{{ pn.stroke }}" data-prad="{{ pn.radius }}" data-dash="{{ pn.dashed }}" style="position:absolute;box-sizing:border-box;border-width:2px;border-style:solid;border-radius:16px;touch-action:auto"></div>
  </sc-for>
  <sc-for list="{{ persps }}" as="pg" hint-placeholder-count="0">
    <svg xmlns="http://www.w3.org/2000/svg" data-x="{{ pg.x }}" data-y="{{ pg.y }}" data-prad="{{ pg.radius }}" width="{{ pg.w }}" height="{{ pg.h }}" viewBox="{{ pg.vb }}" visibility="{{ pg.vis }}" style="position:absolute;overflow:hidden;pointer-events:none">
      <defs><radialGradient id="{{ pg.gid }}" cx="{{ pg.gcx }}" cy="{{ pg.gcy }}" r="0.75"><stop offset="0" stop-color="#FFFFFF" stop-opacity="1"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop></radialGradient><clipPath id="{{ pg.cid }}"><rect x="0" y="{{ pg.clipY }}" width="{{ pg.w }}" height="{{ pg.clipH }}"></rect></clipPath></defs>
      <g clip-path="{{ pg.clipRef }}">
      <rect x="0" y="0" width="{{ pg.w }}" height="{{ pg.h }}" fill="{{ pg.gfill }}" opacity="{{ pg.glowOp }}"></rect>
      <sc-for list="{{ pg.paths }}" as="p" hint-placeholder-count="0">
        <path d="{{ p.d }}" fill="{{ p.fill }}" stroke="{{ p.stroke }}" stroke-width="{{ p.sw }}" opacity="{{ p.op }}" stroke-linecap="round"></path>
      </sc-for>
      </g>
    </svg>
  </sc-for>
  <sc-for list="{{ texts }}" as="t" hint-placeholder-count="4">
    <div style="position:absolute;z-index:2;box-sizing:border-box;touch-action:auto;text-align:center;line-height:1.2;white-space:nowrap" data-x="{{ t.x }}" data-y="{{ t.y }}" data-w="{{ t.w }}" data-rot="{{ t.rot }}" data-fs="{{ t.fs }}" data-fw="{{ t.fw }}" data-fst="{{ t.fst }}" data-ff="{{ t.ff }}" data-col="{{ t.color }}" data-al="{{ t.align }}">
      <span data-field="text" data-tex="{{ t.text }}" style="cursor:text;padding:0 2px"></span>
    </div>
  </sc-for>

  <sc-for list="{{ tokens }}" as="k" hint-placeholder-count="4">
    <div data-x="{{ k.x }}" data-y="{{ k.y }}" style="position:absolute;width:60px;height:60px;touch-action:auto">
      <sc-if value="{{ k.stack }}" hint-placeholder-val="{{ false }}">
        <div data-fill="{{ k.fill }}" data-stroke="{{ k.stroke }}" data-dash="{{ k.dashed }}" style="position:absolute;left:30px;top:-30px;width:60px;height:60px;box-sizing:border-box;border-width:2px;border-radius:8px"></div>
        <div data-fill="{{ k.fill }}" data-stroke="{{ k.stroke }}" data-dash="{{ k.dashed }}" style="position:absolute;left:20px;top:-20px;width:60px;height:60px;box-sizing:border-box;border-width:2px;border-radius:8px"></div>
        <div data-fill="{{ k.fill }}" data-stroke="{{ k.stroke }}" data-dash="{{ k.dashed }}" style="position:absolute;left:10px;top:-10px;width:60px;height:60px;box-sizing:border-box;border-width:2px;border-radius:8px"></div>
      </sc-if>
      <div data-fill="{{ k.fill }}" data-stroke="{{ k.stroke }}" data-dash="{{ k.dashed }}" data-round="{{ k.round }}" data-fg="{{ k.color }}" data-split="{{ k.split }}" data-split2="{{ k.fill2 }}" data-line="{{ k.line }}" style="position:absolute;inset:0;box-sizing:border-box;border-radius:8px;border-width:2px;display:flex;align-items:center;justify-content:center;font-family:'Latin Modern Math','CMU Serif','Cambria Math',serif;font-size:24px;line-height:1;overflow:hidden">
        <sc-if value="{{ k.noise }}" hint-placeholder-val="{{ false }}">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56" style="position:absolute;left:0;top:0;pointer-events:none">
            <g fill="{{ k.color }}" fill-opacity="0.5">
              <sc-for list="{{ k.dots }}" as="d" hint-placeholder-count="0"><circle cx="{{ d.cx }}" cy="{{ d.cy }}" r="{{ d.r }}"></circle></sc-for>
            </g>
          </svg>
        </sc-if>
        <span data-field="tex" data-tex="{{ k.tex }}" style="cursor:text;white-space:nowrap;min-width:10px;position:relative;display:flex;align-items:center;justify-content:center;height:100%;width:100%;text-align:center"></span>
      </div>
    </div>
  </sc-for>

  <sc-for list="{{ curves }}" as="cv" hint-placeholder-count="2">
    <svg xmlns="http://www.w3.org/2000/svg" data-x="{{ cv.x }}" data-y="{{ cv.y }}" data-z="{{ cv.z }}" width="{{ cv.w }}" height="{{ cv.h }}" viewBox="{{ cv.vb }}" style="position:absolute;overflow:visible;touch-action:auto">
      <path d="{{ cv.d }}" fill="none" stroke="transparent" stroke-width="14"></path>
      <path d="{{ cv.d }}" fill="none" stroke="{{ cv.stroke }}" stroke-width="{{ cv.sw }}" stroke-dasharray="{{ cv.dashArr }}" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="{{ cv.arrowD }}" fill="{{ cv.stroke }}" stroke="none"></path>
      <sc-for list="{{ cv.dotList }}" as="d" hint-placeholder-count="0">
        <circle cx="{{ d.cx }}" cy="{{ d.cy }}" r="{{ d.r }}" fill="{{ d.fill }}" stroke="{{ d.stroke }}" stroke-width="{{ d.sw }}"></circle>
      </sc-for>
      <sc-for list="{{ cv.handles }}" as="hd" hint-placeholder-count="0">
        <circle data-ui="1" cx="{{ hd.x }}" cy="{{ hd.y }}" r="7" fill="#FFFFFF" stroke="#4A72B5" stroke-width="2" style="cursor:default"></circle>
      </sc-for>
    </svg>
  </sc-for>

  <sc-for list="{{ links }}" as="lk" hint-placeholder-count="0">
    <svg xmlns="http://www.w3.org/2000/svg" data-x="{{ lk.x }}" data-y="{{ lk.y }}" data-z="{{ lk.z }}" width="{{ lk.w }}" height="{{ lk.h }}" viewBox="{{ lk.vb }}" style="position:absolute;overflow:visible;cursor:default;touch-action:auto">
      <path d="{{ lk.d }}" fill="none" stroke="transparent" stroke-width="12"></path>
      <path d="{{ lk.d }}" fill="none" stroke="{{ lk.stroke }}" stroke-width="{{ lk.sw }}" stroke-dasharray="{{ lk.dashArr }}" stroke-linecap="round"></path>
      <path d="{{ lk.markD }}" fill="none" stroke="{{ lk.stroke }}" stroke-width="3.5" stroke-linecap="round"></path>
      <path d="{{ lk.arrowD }}" fill="{{ lk.stroke }}" stroke="none"></path>
    </svg>
  </sc-for>

  <sc-for list="{{ imgs }}" as="m" hint-placeholder-count="3">
    <div  data-x="{{ m.x }}" data-y="{{ m.y }}" data-w="{{ m.w }}" data-h="{{ m.h }}" data-rot="{{ m.rot }}" style="position:absolute;touch-action:auto;z-index:1">
      <sc-if value="{{ m.hasSrc }}" hint-placeholder-val="{{ false }}">
<div data-src="{{ m.src }}" data-stroke="{{ m.color }}" data-dash="{{ m.dashed }}" data-fit="{{ m.fit }}" data-rad="{{ m.radius }}" data-bw="{{ m.borderW }}" data-tbg="{{ m.tbg }}" data-scale="{{ m.scale }}" data-ar="{{ m.ar }}" style="position:absolute;inset:0;box-sizing:border-box;border-width:2px;border-style:solid;border-radius:8px;background-color:transparent;background-repeat:no-repeat;background-position:center;background-size:cover;pointer-events:none"></div>
      </sc-if>
      <sc-if value="{{ m.noSrc }}" hint-placeholder-val="{{ true }}">
        <div data-stroke="{{ m.color }}" data-fg="{{ m.color }}" data-dash="{{ m.phDash }}" data-fill="{{ m.phFill }}" style="position:absolute;inset:0;box-sizing:border-box;border-width:2px;border-style:dashed;border-radius:8px;background:rgba(255,255,255,0.85);display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;line-height:1.2;padding:3px;overflow:hidden">
          <sc-if value="{{ m.hasIcon }}" hint-placeholder-val="{{ false }}">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="{{ m.iconVb }}" data-x="{{ m.iconX }}" data-y="{{ m.iconY }}" data-w="{{ m.iconW }}" data-h="{{ m.iconH }}" style="position:absolute;width:70%;height:70%;pointer-events:none">
              <sc-for list="{{ m.iconPaths }}" as="p" hint-placeholder-count="0"><path d="{{ p.d }}" fill="{{ p.fill }}" stroke="{{ p.stroke }}" stroke-width="{{ p.sw }}" stroke-linecap="round" stroke-linejoin="round"></path></sc-for>
            </svg>
          </sc-if>
          <span data-field="label" data-hid="{{ m.hasIcon }}" data-tex="{{ m.label }}" style="cursor:text"></span>
        </div>
      </sc-if>
    </div>
  </sc-for>

  <sc-for list="{{ sliders }}" as="sl" hint-placeholder-count="0">
    <svg xmlns="http://www.w3.org/2000/svg" data-x="{{ sl.x }}" data-y="{{ sl.y }}" width="{{ sl.w }}" height="{{ sl.h }}" viewBox="{{ sl.vb }}" style="position:absolute;overflow:visible;touch-action:auto">
      <rect x="0" y="12" width="{{ sl.w }}" height="8" rx="4" fill="{{ sl.track }}"></rect>
      <rect x="0" y="12" width="{{ sl.fillW }}" height="8" rx="4" fill="{{ sl.color }}"></rect>
      <circle cx="{{ sl.fillW }}" cy="16" r="8" fill="{{ sl.color }}" stroke="#FFFFFF" stroke-width="2.5" style="cursor:default"></circle>
    </svg>
  </sc-for>

  <sc-for list="{{ svgs }}" as="s" hint-placeholder-count="3">
    <svg xmlns="http://www.w3.org/2000/svg" data-x="{{ s.x }}" data-y="{{ s.y }}" data-rot="{{ s.rot }}" data-z="{{ s.z }}" data-hitsvg="{{ s.hit }}" width="{{ s.w }}" height="{{ s.h }}" viewBox="{{ s.vb }}" style="position:absolute;overflow:visible;touch-action:auto">
      <rect x="0" y="0" width="{{ s.w }}" height="{{ s.h }}" fill="transparent" data-hit="{{ s.hit }}"></rect>
      <sc-for list="{{ s.paths }}" as="p" hint-placeholder-count="1">
        <path d="{{ p.d }}" fill="{{ p.fill }}" stroke="{{ p.stroke }}" stroke-width="{{ p.sw }}" stroke-dasharray="{{ p.dash }}" stroke-linecap="round" stroke-linejoin="round"></path>
      </sc-for>
      <sc-for list="{{ s.dots }}" as="d" hint-placeholder-count="0">
        <circle cx="{{ d.cx }}" cy="{{ d.cy }}" r="{{ d.r }}" fill="{{ d.fill }}" stroke="{{ d.stroke }}" stroke-width="{{ d.sw }}"></circle>
      </sc-for>
    </svg>
  </sc-for>

  <sc-for list="{{ boxes }}" as="b" hint-placeholder-count="2">
    <div data-x="{{ b.x }}" data-y="{{ b.y }}" data-w="{{ b.w }}" data-h="{{ b.h }}" data-fill="{{ b.fill }}" data-stroke="{{ b.stroke }}" data-fg="{{ b.color }}" data-dash="{{ b.dashed }}" data-prad="{{ b.radius }}" style="position:absolute;box-sizing:border-box;border-width:2px;border-style:solid;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:auto;text-align:center;padding:4px 10px">
      <span data-field="title" data-tex="{{ b.title }}" data-fs="{{ b.fs }}" data-fw="{{ b.fw }}" data-ff="{{ b.ff }}" style="cursor:text;line-height:1.15;white-space:pre-wrap"></span>
      <sc-if value="{{ b.hasSub }}" hint-placeholder-val="{{ false }}">
        <span data-field="sub" data-tex="{{ b.sub }}" data-fs="{{ b.subFs }}" style="cursor:text;line-height:1.2;margin-top:6px;color:#3A3A3A"></span>
      </sc-if>
    </div>
  </sc-for>

  <sc-for list="{{ callouts }}" as="c" hint-placeholder-count="2">
    <div data-x="{{ c.x }}" data-y="{{ c.y }}" data-w="{{ c.w }}" data-h="{{ c.h }}" style="position:absolute;box-sizing:border-box;border:2px solid #C9CCD1;border-radius:12px;background:#FAFAFA;display:flex;align-items:center;gap:10px;padding:0 12px;touch-action:auto">
      <div style="flex:none;width:36px;height:36px;border-radius:50%;box-sizing:border-box;border:2px solid #C9A227;background:#FBF3D3;color:#B8901F;font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:center">
        <span data-field="num" data-tex="{{ c.num }}" style="cursor:text"></span>
      </div>
      <div style="display:flex;flex-direction:column;justify-content:flex-start;line-height:1.3;font-size:13px;gap:4px;height:100%;box-sizing:border-box;padding-top:9px">
        <span data-field="title" data-tex="{{ c.title }}" data-fg="{{ c.color }}" data-fw="{{ c.fw }}" data-fs="{{ c.fs }}" data-ff="{{ c.ff }}" style="cursor:text"></span>
        <span data-field="body" data-tex="{{ c.body }}" style="cursor:text;color:#3A3A3A"></span>
      </div>
    </div>
  </sc-for>

  <sc-for list="{{ legends }}" as="l" hint-placeholder-count="3">
    <div data-x="{{ l.x }}" data-y="{{ l.y }}" data-ff="{{ l.ff }}" data-fs="{{ l.fs }}" style="position:absolute;display:flex;align-items:center;gap:14px;touch-action:auto;font-size:19px;color:#3A3A3A;white-space:nowrap">
      <div data-fill="{{ l.fill }}" data-stroke="{{ l.stroke }}" data-dash="{{ l.dashed }}" style="width:34px;height:26px;box-sizing:border-box;border-width:2px;border-radius:6px"></div>
      <span data-field="text" data-tex="{{ l.text }}" style="cursor:text"></span>
    </div>
  </sc-for>

  <sc-if value="{{ hasSel }}" hint-placeholder-val="{{ false }}">
    <div data-ui="1" data-rot="{{ selBox.rot }}" style="position:absolute;pointer-events:none;border:1.5px dashed #4A72B5;border-radius:6px;box-sizing:border-box" data-x="{{ selBox.x }}" data-y="{{ selBox.y }}" data-w="{{ selBox.w }}" data-h="{{ selBox.h }}">
      <sc-if value="{{ selCanRot }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:50%;top:-26px;width:1.5px;height:20px;margin-left:-0.75px;background:#4A72B5"></div>
        <div  style="position:absolute;left:50%;top:-36px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;border:2px solid #4A72B5;box-sizing:border-box;cursor:default;pointer-events:auto;touch-action:auto"></div>
      </sc-if>
    </div>
  </sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  static VIEW_ONLY = true;
  clearSel = () => {};

  static SITE_IMG = {
    'nb0-d': 'site/media/egocf/multi_agent_nudge_left/raw/f32.jpg', 'nb0-r': 'site/media/robotwin/ep104/ctrlwam/f0135.jpg',
    'nb1-d': 'site/media/egocf/multi_agent_stop/raw/f22.jpg',       'nb1-r': 'site/media/robotwin/ep104/ctrlwam/f0250.jpg',
    'cb0-d': 'site/media/egocf/real/raw/f32.jpg',                   'cb0-r': 'site/media/robotwin/ep104/gt/f0135.jpg',
    'cb1-d': 'site/media/egocf/real/raw/f22.jpg',                   'cb1-r': 'site/media/robotwin/ep104/gt/f0250.jpg',
    'driving scene': 'site/media/egocf/real/raw/f12.jpg', 'driving frame#0': 'site/media/egocf/real/raw/f22.jpg', 'driving frame#1': 'site/media/egocf/real/raw/f40.jpg',
    'robotics scene': 'site/media/robotwin/ep104/gt/f0000.jpg', 'robotics frame#0': 'site/media/robotwin/ep104/gt/f0125.jpg', 'robotics frame#1': 'site/media/robotwin/ep104/gt/f0315.jpg'
  };
  static SITE_KEY = 'ctrlwam-teaser-figure-view-images';
  // Fill empty slots with site media; user drops (persisted per slot) win.
  static siteImages(items) {
    items = items.map(it => (it.type === 'text' && it.text === 'Corrective learning') ? { ...it, text: 'Physically aligned noising', fs: Math.min(it.fs || 28, 26) } : it);
    let ov = {}; try { ov = JSON.parse(localStorage.getItem(Component.SITE_KEY) || '{}'); } catch (e) {}
    const seen = {};
    return items.map(it => {
      if (it.type !== 'img' || it.label === 'logo') return it;
      const lb = it.x >= 940 ? it.label : ''; const n = seen[lb] = (seen[lb] || 0); seen[lb]++;
      const key = Component.SITE_IMG[it.id] ? it.id : (Component.SITE_IMG[it.label + '#' + n] ? it.label + '#' + n : it.label);
      const src = ov[it.id] || (it.src && !/^data:/.test(it.src) ? it.src : null) || Component.SITE_IMG[key];
      if (!src) return it;
      return { ...it, src, fit: 'cover', borderW: it.borderW == null ? 2 : it.borderW, tbg: false, keepAR: false, siteKey: it.id };
    });
  }

  wrapRef = React.createRef(); scaleRef = React.createRef(); canvasRef = React.createRef();
  standalone = (() => { try { return window.self === window.top; } catch (e) { return true; } })();
  static C = {
    o: { fg: '#A6593F', fill: '#F5E8E1', st: '#BA7962' },
    b: { fg: '#466A96', fill: '#EAF0F7', st: '#7794B5' },
    g: { fg: '#477454', fill: '#E9F1E8', st: '#76977C' },
    y: { fg: '#33465C', fill: '#F3F5F4', st: '#C9D5CF' }
  };
  // Semantic palette: terracotta = perturbed / mismatch, blue = recorded,
  // sage = aligned. Secondary panels share quiet surfaces and navy headings.
  // Apply to editable item data so PNG, SVG and PDF exports use the same colors.
  static COLOR_MAP = {
    '#E8641B': '#A6593F', '#D8742A': '#A6593F', '#E0894A': '#BA7962',
    '#FCEDE4': '#FAF4F0', '#FCE9DB': '#F5E8E1', '#F9DDCB': '#F0DED4',
    '#FDF3EC': '#FCF8F5', '#D0312D': '#B25950',
    '#3A6FD8': '#466A96', '#3A63A8': '#466A96', '#4A72B5': '#7794B5',
    '#EAF1FB': '#F1F5FA', '#E3ECF7': '#EAF0F7', '#D3E2F6': '#DFE8F3',
    '#4C9A3B': '#477454', '#4C7A3B': '#477454', '#5E8A4C': '#76977C',
    '#EDF6E9': '#F1F6EF', '#E8F0E2': '#E9F1E8', '#D9EBD2': '#DDEAD9',
    '#F1F7EE': '#F7FAF5', '#1F2A3A': '#25364B', '#C9CDD3': '#D2DADF',
    '#FDF8E6': '#F3F6F2', '#FFFCF2': '#FCFDFC', '#DCC070': '#C9D5C8',
    '#B8901F': '#33465C', '#D08A2A': '#A6593F', '#8F7A22': '#466A96',
    '#D4B24C': '#76977C', '#FBF3D3': '#F3F5F4',
    '#D0E8F0': '#F1F5F7', '#F0F8F8': '#FCFDFE', '#A8C0D0': '#C8D5DF',
    '#084868': '#33465C', '#F8F0F8': '#F5F6F8', '#5A2A5A': '#33465C',
    '#C8A8C0': '#C8D2DD', '#7A4BA6': '#60758C', '#F3EEFA': '#EFF3F7',
    '#2E3A8C': '#466A96', '#EEF0FA': '#EAF0F7',
    '#1FA8A8': '#39858A', '#E6F6F6': '#EAF4F3',
    '#FDEFE6': '#F5E8E1', '#C4287A': '#A26384', '#FBE8F1': '#F5EDF2',
    '#8A8F98': '#637184', '#D9DEE6': '#DFE5E9',
    '#EED0A8': '#EDF2EE', '#DCC8D8': '#EDF2EE'
  };
  static FIGURE_FONT = 'Arial, Helvetica, sans-serif';
  static refineTypography(items) {
    const labels = {
      'Noised action & Noised video do not match': 'Noised action and noised video disagree',
      'Clean action & Clean video match': 'Recorded action–video pair',
      'Noised action & Noised renders match': 'Noised action and noised rendering agree',
      'Recovered target': 'Ground-truth target',
      'Joint Generation': 'Joint prediction',
      'Forward Dynamics': 'Video prediction',
      'Inverse Dynamics': 'Action prediction',
      'Multi-agent control beyond ego': 'Control beyond the ego',
      'Command ADE $\\downarrow$': 'Command ADE (m) $\\downarrow$',
      '1.023 → 0.981 m': '1.023 $\\rightarrow$ 0.981', '1.023 → 0.981': '1.023 $\\rightarrow$ 0.981', '58.65 → 61.75': '58.65 $\\rightarrow$ 61.75',
      '| Aligned Intent and Foresight': 'Aligned intent and foresight'
    };
    const headings = new Set(['Corrective learning', 'Flexible control', 'Driving and robotics']);
    const modes = new Set(['Joint Generation', 'Forward Dynamics', 'Inverse Dynamics']);
    const result = items.map(it => {
      if (it.type !== 'text') return it;
      const out = { ...it, ff: it.ff || Component.FIGURE_FONT };
      if (labels[it.text]) out.text = labels[it.text];
      if (headings.has(it.text)) { out.fs = 28; out.y += 3; }
      if (modes.has(it.text)) out.fs = 16;
      if (it.text.includes(' & ')) { out.fs = 18; out.fw = 600; }
      if (it.text === '1.023 → 0.981 m' || it.text === '58.65 → 61.75') { out.fs = 27; out.y -= 3; }
      if (it.text === '| Aligned Intent and Foresight') { out.x = 736; out.w = 420; out.fs = 31; out.y += 1; }
      if (it.text.startsWith('Ctrl{color:')) { out.x = 506; out.w = 230; out.fs = 46; }
      return out;
    });
    const logo = result.find(it => it.type === 'img' && it.label === 'logo');
    if (logo) { logo.x = 437; }
    return Component.refineModalityColors(result);
