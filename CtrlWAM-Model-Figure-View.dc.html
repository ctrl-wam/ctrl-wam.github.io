<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="site/vendor/katex/katex.min.css">
<script defer src="site/vendor/katex/katex.min.js"></script>
<style>@font-face{font-family:"Latin Modern Math";src:url("https://cdn.jsdelivr.net/npm/mathjax-full@3.2.2/es5/output/chtml/fonts/woff-v2/MathJax_Math-Italic.woff") format("woff");font-style:italic;font-display:swap;}@font-face{font-family:"Latin Modern Math";src:url("https://cdn.jsdelivr.net/npm/mathjax-full@3.2.2/es5/output/chtml/fonts/woff-v2/MathJax_Main-Regular.woff") format("woff");font-style:normal;font-display:swap;}</style>
<style>@keyframes ctrlwamPulse{0%,100%{opacity:.0}50%{opacity:.55}}@keyframes ctrlwamDrift{from{background-position:0 0}to{background-position:64px 0}}math{font-family:"Latin Modern Math","Computer Modern","CMU Serif","Cambria Math",serif;} body{margin:0;background:transparent;} a{color:#0B1A3A;} a:hover{color:#88CC02;} .katex{line-height:1 !important;} .katex .strut{display:none !important;} [contenteditable="true"]{outline:1.5px solid #4A72B5;outline-offset:2px;border-radius:2px;}</style>
</helmet>

<div ref="{{ wrapRef }}" style="margin:0;overflow:hidden;width:100%;display:block">
<div style="transform-origin:0 0" ref="{{ scaleRef }}">
<div ref="{{ canvasRef }}" data-screen-label="CtrlWAM Model Figure v6" style="position:relative;width:1600px;height:910px;box-sizing:border-box;background:#FFFFFF;border:1px solid #DCE2EC;border-radius:16px;overflow:hidden;font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#2E2E2E;user-select:text">

  <sc-for list="{{ panels }}" as="pn" hint-placeholder-count="4">
    <div data-x="{{ pn.x }}" data-y="{{ pn.y }}" data-w="{{ pn.w }}" data-h="{{ pn.h }}" data-fill="{{ pn.fill }}" data-stroke="{{ pn.stroke }}" data-prad="{{ pn.radius }}" data-dash="{{ pn.dashed }}" style="position:absolute;box-sizing:border-box;border-width:2px;border-style:solid;border-radius:16px;touch-action:auto"></div>
  </sc-for>
  <sc-for list="{{ texts }}" as="t" hint-placeholder-count="4">
    <div style="position:absolute;z-index:2;box-sizing:border-box;touch-action:auto;text-align:center;line-height:1.2;white-space:nowrap" data-x="{{ t.x }}" data-y="{{ t.y }}" data-w="{{ t.w }}" data-fs="{{ t.fs }}" data-fw="{{ t.fw }}" data-fst="{{ t.fst }}" data-col="{{ t.color }}" data-al="{{ t.align }}">
      <span data-field="text" data-tex="{{ t.text }}" style="cursor:text;padding:0 2px"></span>
    </div>
  </sc-for>

  <sc-for list="{{ tokens }}" as="k" hint-placeholder-count="4">
    <div data-x="{{ k.x }}" data-y="{{ k.y }}" data-w="{{ k.w }}" data-h="{{ k.h }}" style="position:absolute;width:72px;height:44px;touch-action:auto">
      <sc-if value="{{ k.stack }}" hint-placeholder-val="{{ false }}">
        <div data-fill="{{ k.fill }}" data-stroke="{{ k.stroke }}" data-dash="{{ k.dashed }}" style="position:absolute;left:24px;top:-24px;width:72px;height:44px;box-sizing:border-box;border-width:2px;border-radius:8px"></div>
        <div data-fill="{{ k.fill }}" data-stroke="{{ k.stroke }}" data-dash="{{ k.dashed }}" style="position:absolute;left:16px;top:-16px;width:72px;height:44px;box-sizing:border-box;border-width:2px;border-radius:8px"></div>
        <div data-fill="{{ k.fill }}" data-stroke="{{ k.stroke }}" data-dash="{{ k.dashed }}" style="position:absolute;left:8px;top:-8px;width:72px;height:44px;box-sizing:border-box;border-width:2px;border-radius:8px"></div>
      </sc-if>
      <div data-fill="{{ k.fill }}" data-stroke="{{ k.stroke }}" data-dash="{{ k.dashed }}" data-round="{{ k.round }}" data-fg="{{ k.color }}" data-split="{{ k.split }}" data-split2="{{ k.fill2 }}" data-line="{{ k.line }}" style="position:absolute;inset:0;box-sizing:border-box;border-radius:8px;border-width:2px;display:flex;align-items:center;justify-content:center;font-family:'Latin Modern Math','CMU Serif','Cambria Math',serif;font-size:20px;line-height:1;overflow:hidden">
        <sc-if value="{{ k.noise }}" hint-placeholder-val="{{ false }}">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" preserveAspectRatio="none" width="68" height="40" style="position:absolute;left:0;top:0;pointer-events:none">
            <g fill="{{ k.color }}" fill-opacity="0.5">
              <sc-for list="{{ k.dots }}" as="d" hint-placeholder-count="0"><circle cx="{{ d.cx }}" cy="{{ d.cy }}" r="{{ d.r }}"></circle></sc-for>
            </g>
          </svg>
        </sc-if>
        <span data-field="tex" data-tex="{{ k.tex }}" style="cursor:text;white-space:nowrap;min-width:10px;position:relative;display:flex;align-items:center;justify-content:center;height:100%;width:100%;text-align:center"></span>
      </div>
    </div>
  </sc-for>

  <sc-for list="{{ curves }}" as="cv" hint-placeholder-count="2">
    <svg xmlns="http://www.w3.org/2000/svg" data-x="{{ cv.x }}" data-y="{{ cv.y }}" data-z="{{ cv.z }}" width="{{ cv.w }}" height="{{ cv.h }}" viewBox="{{ cv.vb }}" style="position:absolute;overflow:visible;touch-action:auto">
      <path d="{{ cv.d }}" fill="none" stroke="transparent" stroke-width="14"></path>
      <path d="{{ cv.d }}" fill="none" stroke="{{ cv.stroke }}" stroke-width="{{ cv.sw }}" stroke-dasharray="{{ cv.dashArr }}" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="{{ cv.arrowD }}" fill="{{ cv.stroke }}" stroke="none"></path>
      <sc-for list="{{ cv.dotList }}" as="d" hint-placeholder-count="0">
        <circle cx="{{ d.cx }}" cy="{{ d.cy }}" r="{{ d.r }}" fill="{{ d.fill }}" stroke="{{ d.stroke }}" stroke-width="{{ d.sw }}"></circle>
      </sc-for>
      <sc-for list="{{ cv.handles }}" as="hd" hint-placeholder-count="0">
        <circle data-ui="1" cx="{{ hd.x }}" cy="{{ hd.y }}" r="7" fill="#FFFFFF" stroke="#4A72B5" stroke-width="2" style="cursor:default"></circle>
      </sc-for>
    </svg>
  </sc-for>

  <sc-for list="{{ imgs }}" as="m" hint-placeholder-count="3">
    <div data-x="{{ m.x }}" data-y="{{ m.y }}" data-w="{{ m.w }}" data-h="{{ m.h }}" data-rot="{{ m.rot }}" style="position:absolute;touch-action:auto;z-index:1">
      <sc-if value="{{ m.stack3 }}" hint-placeholder-val="{{ false }}">
        <div data-src="{{ m.src }}" data-stroke="{{ m.color }}" data-fit="{{ m.fit }}" data-rad="{{ m.radius }}" data-bw="{{ m.borderW }}" data-scale="{{ m.scale }}" data-ghost="{{ m.ghostDash }}" style="position:absolute;left:16px;top:-16px;width:100%;height:100%;box-sizing:border-box;border-width:2px;border-style:solid;border-radius:8px;background-color:#FFFFFF;background-repeat:no-repeat;background-position:center;background-size:cover;pointer-events:none"></div>
        <div data-src="{{ m.src }}" data-stroke="{{ m.color }}" data-fit="{{ m.fit }}" data-rad="{{ m.radius }}" data-bw="{{ m.borderW }}" data-scale="{{ m.scale }}" data-ghost="{{ m.ghostDash }}" style="position:absolute;left:8px;top:-8px;width:100%;height:100%;box-sizing:border-box;border-width:2px;border-style:solid;border-radius:8px;background-color:#FFFFFF;background-repeat:no-repeat;background-position:center;background-size:cover;pointer-events:none"></div>
      </sc-if>
      <sc-if value="{{ m.hasSrc }}" hint-placeholder-val="{{ false }}">
        <div data-src="{{ m.src }}" data-stroke="{{ m.color }}" data-fit="{{ m.fit }}" data-rad="{{ m.radius }}" data-bw="{{ m.borderW }}" data-tbg="{{ m.tbg }}" data-scale="{{ m.scale }}" data-ar="{{ m.ar }}" style="position:absolute;inset:0;box-sizing:border-box;border-width:2px;border-style:solid;border-radius:8px;background-color:transparent;background-repeat:no-repeat;background-position:center;background-size:cover;pointer-events:none"></div>
      </sc-if>
      <sc-if value="{{ m.noSrc }}" hint-placeholder-val="{{ true }}">
        <div data-stroke="{{ m.color }}" data-fg="{{ m.color }}" style="position:absolute;inset:0;box-sizing:border-box;border-width:2px;border-style:dashed;border-radius:8px;background:rgba(255,255,255,0.85);display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;line-height:1.25;padding:4px">
          <span data-field="label" data-tex="{{ m.label }}" style="cursor:text"></span>
        </div>
      </sc-if>
    </div>
  </sc-for>

  <sc-for list="{{ svgs }}" as="s" hint-placeholder-count="3">
    <svg xmlns="http://www.w3.org/2000/svg" data-x="{{ s.x }}" data-y="{{ s.y }}" data-rot="{{ s.rot }}" data-z="{{ s.z }}" data-hitsvg="{{ s.hit }}" width="{{ s.w }}" height="{{ s.h }}" viewBox="{{ s.vb }}" style="position:absolute;overflow:visible;touch-action:auto">
      <rect x="0" y="0" width="{{ s.w }}" height="{{ s.h }}" fill="transparent" data-hit="{{ s.hit }}"></rect>
      <sc-for list="{{ s.paths }}" as="p" hint-placeholder-count="1">
        <path d="{{ p.d }}" fill="{{ p.fill }}" stroke="{{ p.stroke }}" stroke-width="{{ p.sw }}" stroke-dasharray="{{ p.dash }}" stroke-linecap="round" stroke-linejoin="round"></path>
      </sc-for>
      <sc-for list="{{ s.dots }}" as="d" hint-placeholder-count="0">
        <circle cx="{{ d.cx }}" cy="{{ d.cy }}" r="{{ d.r }}" fill="{{ d.fill }}" stroke="{{ d.stroke }}" stroke-width="{{ d.sw }}"></circle>
      </sc-for>
    </svg>
  </sc-for>

  <sc-for list="{{ boxes }}" as="b" hint-placeholder-count="2">
    <div data-x="{{ b.x }}" data-y="{{ b.y }}" data-w="{{ b.w }}" data-h="{{ b.h }}" data-z="{{ b.z }}" data-fill="{{ b.fill }}" data-stroke="{{ b.stroke }}" data-fg="{{ b.color }}" data-dash="{{ b.dashed }}" style="position:absolute;box-sizing:border-box;border-width:2px;border-style:solid;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:auto;text-align:center;padding:4px 10px">
      <span data-field="title" data-tex="{{ b.title }}" data-fs="{{ b.fs }}" data-fw="{{ b.fw }}" style="cursor:text;line-height:1.15;white-space:pre-wrap"></span>
      <sc-if value="{{ b.hasSub }}" hint-placeholder-val="{{ false }}">
        <span data-field="sub" data-tex="{{ b.sub }}" data-fs="{{ b.subFs }}" style="cursor:text;line-height:1.2;margin-top:6px;color:#3A3A3A"></span>
      </sc-if>
    </div>
  </sc-for>

  <sc-for list="{{ callouts }}" as="c" hint-placeholder-count="2">
    <div data-x="{{ c.x }}" data-y="{{ c.y }}" data-w="{{ c.w }}" data-h="{{ c.h }}" style="position:absolute;box-sizing:border-box;border:2px solid #C9CCD1;border-radius:12px;background:#FAFAFA;display:flex;align-items:center;gap:10px;padding:0 12px;touch-action:auto">
      <div style="flex:none;width:36px;height:36px;border-radius:50%;box-sizing:border-box;border:2px solid #C9A227;background:#FBF3D3;color:#B8901F;font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:center">
        <span data-field="num" data-tex="{{ c.num }}" style="cursor:text"></span>
      </div>
      <div style="display:flex;flex-direction:column;justify-content:flex-start;line-height:1.3;font-size:13px;gap:4px;height:100%;box-sizing:border-box;padding-top:9px">
        <span data-field="title" data-tex="{{ c.title }}" data-fg="{{ c.color }}" data-fw="{{ c.fw }}" data-fs="{{ c.fs }}" style="cursor:text"></span>
        <span data-field="body" data-tex="{{ c.body }}" style="cursor:text;color:#3A3A3A"></span>
      </div>
    </div>
  </sc-for>

  <sc-for list="{{ legends }}" as="l" hint-placeholder-count="3">
    <div data-x="{{ l.x }}" data-y="{{ l.y }}" style="position:absolute;display:flex;align-items:center;gap:14px;touch-action:auto;font-size:19px;color:#3A3A3A">
      <div data-fill="{{ l.fill }}" data-stroke="{{ l.stroke }}" data-dash="{{ l.dashed }}" style="width:38px;height:28px;box-sizing:border-box;border-width:2px;border-radius:6px"></div>
      <span data-field="text" data-tex="{{ l.text }}" style="cursor:text"></span>
    </div>
  </sc-for>

  <sc-if value="{{ hasSel }}" hint-placeholder-val="{{ false }}">
    <div data-ui="1" data-rot="{{ selBox.rot }}" style="position:absolute;pointer-events:none;border:1.5px dashed #4A72B5;border-radius:6px;box-sizing:border-box" data-x="{{ selBox.x }}" data-y="{{ selBox.y }}" data-w="{{ selBox.w }}" data-h="{{ selBox.h }}">
      <sc-if value="{{ selCanRot }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:50%;top:-26px;width:1.5px;height:20px;margin-left:-0.75px;background:#4A72B5"></div>
        <div  style="position:absolute;left:50%;top:-36px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;border:2px solid #4A72B5;box-sizing:border-box;cursor:default;pointer-events:auto;touch-action:auto"></div>
      </sc-if>
    </div>
  </sc-if>
  <div ref="{{ flowRef }}" style="position:absolute;inset:0;z-index:5;pointer-events:none"></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  static VIEW_ONLY = true;
  clearSel = () => {};
  // ---- token flow animation: imperative overlay (no React re-render per frame) ----
  flowRef = React.createRef();
  startFlow() {
    const C = Component.C, host = this.flowRef.current; if (!host) return;
    const cols = [{ x: 204, c: 'o', tx: [44, 120, 196, 312] }, { x: 624, c: 'b', tx: [44, 120, 196, 312] }, { x: 1044, c: 'g', tx: [80, 196, 296, 412, 512, 628] }], K = [0, 1, 2, 3];
    const CLEAN_DIM = .0; // output tokens keep each modality's own colour (orange video, blue action, green agents)
    const IN_Y = 271, DIT_TOP = 398, DIT_BOT = 504, OUT_Y = 550;
    const mk = (css) => { const d = document.createElement('div'); d.style.cssText = 'position:absolute;' + css; host.appendChild(d); return d; };
    const ins = [], outs = [];
    cols.forEach((col, ci) => K.forEach((k, ki) => {
      ins.push(mk(`left:0;top:0;width:18px;height:18px;border-radius:5px;border:1.5px dashed ${C[col.c].st};background:radial-gradient(${C[col.c].fg}88 1px,transparent 1.4px) 0 0/5px 5px,#fff;opacity:0;will-change:transform,opacity`));
      outs.push(mk(`left:0;top:0;width:18px;height:18px;border-radius:5px;border:1.5px solid ${C[col.c].st};background:${C[col.c].fill};box-shadow:0 2px 6px rgba(0,0,0,.12);opacity:0;will-change:transform,opacity`));
    }));
    const sweep = mk(`left:139px;top:${DIT_TOP + 2}px;width:260px;height:${DIT_BOT - DIT_TOP - 4}px;border-radius:10px;background:linear-gradient(90deg,transparent,rgba(214,189,112,.5),transparent);opacity:0;will-change:transform,opacity`);
    const glow = mk(`left:139px;top:${DIT_TOP}px;width:1405px;height:${DIT_BOT - DIT_TOP}px;border-radius:12px;box-shadow:inset 0 0 0 2px rgba(184,144,31,.4);opacity:0`);
    const hist = mk(`left:114px;top:446px;width:10px;height:10px;border-radius:5px;background:${C.y.st};opacity:0`);
    const lab = mk(`right:26px;top:404px;padding:4px 12px;border-radius:999px;background:#FFF8E1;border:1.5px solid ${C.y.st};color:${C.y.fg};font:600 15px system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;opacity:0`);
    const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, cl = (v, a, b) => Math.max(a, Math.min(b, v));
    const t0 = performance.now(); let last = 0;
    const tick = now => {
      this._flowRaf = requestAnimationFrame(tick);
      if (now - last < 33) return; last = now;            // ~30 fps is plenty
      const T = ((now - t0) % 9000) / 9000, ph = (a, b) => cl((T - a) / (b - a), 0, 1);
      const pa = ease(ph(.02, .32)), pb = ph(.30, .55), pc = ease(ph(.55, .85)), phist = ease(ph(0, .28));
      let i = 0;
      cols.forEach((col, ci) => K.forEach((k, ki) => {
        const delay = ki * .06, dim = ci === 2 ? .75 : 1;
        const X0 = [4, 424, 844][ci], txs = col.tx, sx = X0 + txs[ki % txs.length], tgt = col.x + (k - 1.5) * 20;
        const a = cl((pa - delay) / .7, 0, 1), y = IN_Y + (DIT_TOP + 30 - IN_Y) * a, xa = sx + (tgt - sx) * Math.min(1, a * 1.6), oa = pa <= 0 || a >= 1 ? 0 : (a < .1 ? a * 10 : a > .9 ? (1 - a) * 10 : 1);
        ins[i].style.transform = `translate(${xa - 9}px,${y - 9}px)`; ins[i].style.opacity = oa * dim;
        const c = cl((pc - delay) / .7, 0, 1), y2 = DIT_BOT - 30 + (OUT_Y + 56 - DIT_BOT) * c, oc = pc <= 0 || c >= 1 ? 0 : (c < .1 ? c * 10 : c > .9 ? (1 - c) * 10 : 1);
        const xc = tgt + (sx - tgt) * Math.max(0, (c - .4) / .6); outs[i].style.transform = `translate(${xc - 9}px,${y2 - 9}px)`; outs[i].style.opacity = oc * dim; i++;
      }));
      const sb = pb > 0 && pb < 1 ? Math.sin(pb * Math.PI) : 0;
      sweep.style.transform = `translateX(${(1405 - 260) * pb}px)`; sweep.style.opacity = sb; glow.style.opacity = sb;
      hist.style.transform = `translateX(${26 * phist}px)`; hist.style.opacity = phist > 0 && phist < 1 ? Math.sin(phist * Math.PI) : 0;
      const txt = T < .32 ? 'noised future tokens enter' : T < .55 ? 'full multimodal attention' : T < .88 ? 'denoised tokens decoded' : '';
      if (lab.textContent !== txt) lab.textContent = txt; lab.style.opacity = txt ? .95 : 0;
    };
    this._flowRaf = requestAnimationFrame(tick);
  }

  wrapRef = React.createRef(); scaleRef = React.createRef(); canvasRef = React.createRef();
  standalone = (() => { try { return window.self === window.top; } catch (e) { return true; } })();
  static C = {
    o: { fg: '#D8742A', fill: '#FCE9DB', st: '#E0894A' },
    b: { fg: '#3A63A8', fill: '#E3ECF7', st: '#4A72B5' },
    g: { fg: '#4C7A3B', fill: '#E8F0E2', st: '#5E8A4C' },
    y: { fg: '#B8901F', fill: '#FBF3D3', st: '#D4B24C' }
  };
  static curveGeom(cv) {
    const P = cv.pts; if (!P || P.length < 2) return { d: '', arrowD: '', dotList: [] };
    const seg = []; // catmull-rom → cubic beziers
    for (let i = 0; i < P.length - 1; i++) { const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2; seg.push([p1, [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6], p2]); }
    const bez = (s, t) => { const u = 1 - t; return [u * u * u * s[0][0] + 3 * u * u * t * s[1][0] + 3 * u * t * t * s[2][0] + t * t * t * s[3][0], u * u * u * s[0][1] + 3 * u * u * t * s[1][1] + 3 * u * t * t * s[2][1] + t * t * t * s[3][1]]; };
    let d = `M${P[0][0]} ${P[0][1]}`; seg.forEach(s => { d += ` C ${s[1][0].toFixed(1)} ${s[1][1].toFixed(1)} ${s[2][0].toFixed(1)} ${s[2][1].toFixed(1)} ${s[3][0]} ${s[3][1]}`; });
    const samples = []; seg.forEach(s => { for (let k = 0; k <= 24; k++) samples.push(bez(s, k / 24)); });
    const cum = [0]; for (let i = 1; i < samples.length; i++) cum.push(cum[i - 1] + Math.hypot(samples[i][0] - samples[i - 1][0], samples[i][1] - samples[i - 1][1]));
    const L = cum[cum.length - 1]; const at = f => { const target = f * L; let i = cum.findIndex(c => c >= target); if (i <= 0) return samples[0]; const a = samples[i - 1], b = samples[i], r = (target - cum[i - 1]) / ((cum[i] - cum[i - 1]) || 1); return [a[0] + (b[0] - a[0]) * r, a[1] + (b[1] - a[1]) * r]; };
    const n = cv.dots || 0, hollow = !!cv.hollow, r = cv.dotR || 5;
    const dotList = []; for (let i = 0; i < n; i++) { const span = cv.dotSpan != null ? cv.dotSpan : (cv.arrow ? 0.74 : 0.82); const f = n === 1 ? 0.5 : 0.06 + span * i / (n - 1); const p = at(f); dotList.push({ cx: +p[0].toFixed(1), cy: +p[1].toFixed(1), r, fill: hollow ? '#FFFFFF' : cv.stroke, stroke: hollow ? cv.stroke : undefined, sw: hollow ? 2.5 : undefined }); }
    let arrowD = ''; if (cv.arrow) { const e = samples[samples.length - 1], q = at(Math.max(0, 1 - 8 / L)); const ang = Math.atan2(e[1] - q[1], e[0] - q[0]); const s = (5 + (cv.sw || 3) * 2.2) * (cv.headScale || 1); const pt = (dx, dy) => `${(e[0] + dx * Math.cos(ang) - dy * Math.sin(ang)).toFixed(1)} ${(e[1] + dx * Math.sin(ang) + dy * Math.cos(ang)).toFixed(1)}`; arrowD = `M${pt(2, 0)} L${pt(-s * 1.6, -s * 0.75)} L${pt(-s * 1.6, s * 0.75)} Z`; }
    return { d, arrowD, dotList };
  }
  static arrowGeom(len, col, dir, dash) { return dir === 'v'
